<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Administración</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      padding: 20px;
    }
    h1 { text-align: center; }
    #login, #admin {
      max-width: 1000px;
      margin: 0 auto 20px;
      background: white;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    input[type="password"] { width:100%; padding:10px; margin-bottom:8px; font-size:16px; }
    button { background:#007bff; color:white; border:none; padding:10px 14px; border-radius:6px; cursor:pointer; margin-right:8px; }
    button:hover { background:#0056b3; }
    #tabla { margin-top:12px; }
    .foto-miniatura { width:80px; height:60px; object-fit:cover; border-radius:6px; }
    .top-buttons { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
    #msg { color:#c0392b; margin-top:8px; }
  </style>
</head>
<body>
  <h1>Panel de Administración</h1>

  <!-- LOGIN -->
  <div id="login">
    <input type="password" id="password" placeholder="Contraseña">
    <div style="margin-top:8px;">
      <button id="btn-login">Ingresar</button>
    </div>
    <p id="msg"></p>
  </div>

  <!-- ADMIN (oculto hasta login) -->
  <div id="admin" style="display:none;">
    <div class="top-buttons">
      <div>
        <button id="btn-guardar">Guardar cambios</button>
        <button id="btn-logout">Salir</button>
      </div>
      <div>
        <button id="volver-btn" onclick="window.location.href='index.html'">Volver al catálogo</button>
      </div>
    </div>

    <div id="tabla"></div>
  </div>

  <script>
    let hot;

    // Renderer que muestra miniatura de la URL en la celda "Foto"
    function imagenRenderer(instance, td, row, col, prop, value, cellProperties) {
      Handsontable.renderers.BaseRenderer.apply(this, arguments);
      td.innerHTML = '';
      const img = document.createElement('img');
      img.src = value && String(value).trim() !== '' ? value : 'https://via.placeholder.com/80x60?text=Sin+Imagen';
      img.className = 'foto-miniatura';
      img.onerror = () => img.src = 'https://via.placeholder.com/80x60?text=Sin+Imagen';
      td.appendChild(img);
      td.style.textAlign = 'center';
      return td;
    }

    // Cargar productos (público) — se usa para inicializar la tabla después del login
    async function cargarProductosParaAdmin() {
      const res = await fetch('/api/products');
      if (!res.ok) throw new Error('No se pudieron cargar los productos');
      const data = await res.json();
      return data;
    }

    // Inicializar Handsontable con los datos
    function inicializarTabla(data) {
      const cont = document.getElementById('tabla');
      cont.innerHTML = '';
      const contenedor = document.createElement('div');
      cont.appendChild(contenedor);

      // si no hay columnas (archivo vacío), definimos las columnas por defecto
      const sample = data && data.length > 0 ? data[0] : { Foto:'', Título:'', Precio:'', Dimensiones:'', Envío:'', Link:'' };
      const columns = Object.keys(sample);

      if (hot) hot.destroy();
      hot = new Handsontable(contenedor, {
        data: data,
        colHeaders: columns,
        columns: columns.map(c => ({
          data: c,
          renderer: c === 'Foto' ? imagenRenderer : undefined
        })),
        rowHeaders: true,
        stretchH: 'all',
        width: '100%',
        height: 500,
        minSpareRows: 1,
        licenseKey: 'non-commercial-and-evaluation'
      });
    }

    // LOGIN: incluye credentials para que la cookie de sesión quede guardada
    async function login() {
      document.getElementById('msg').textContent = '';
      const password = document.getElementById('password').value || '';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        if (!res.ok) {
          const err = await res.json().catch(()=>({}));
          document.getElementById('msg').textContent = err.error || 'Login fallido';
          return;
        }

        // cargar productos y mostrar panel
        const productos = await cargarProductosParaAdmin();
        document.getElementById('login').style.display = 'none';
        document.getElementById('admin').style.display = 'block';
        inicializarTabla(productos);

      } catch (e) {
        console.error('Error login:', e);
        document.getElementById('msg').textContent = 'Error de red al loguear';
      }
    }

    document.getElementById('btn-login').addEventListener('click', login);

    // Guardar cambios: ENVIAR { products: [...] } (el servidor espera este formato)
    async function guardarCambios() {
      if (!hot) { alert('La tabla no está lista'); return; }

      const headers = hot.getColHeader();
      const datos = hot.getData().filter(row => row.some(cell => cell !== null && String(cell).trim() !== ''));

      // Construir array de objetos con claves según headers
      const products = datos.map(row => {
        const obj = {};
        headers.forEach((h, i) => {
          let val = row[i] ?? '';
          // Limpiar HTML accidental en Foto
          if (h === 'Foto') val = String(val).replace(/<[^>]+>/g, '').trim();
          obj[h] = val;
        });
        return obj;
      });

      try {
        const res = await fetch('/api/save', {
          method: 'POST',
          credentials: 'include',               // importante: enviar cookie de sesión
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ products })    // <-- formato CORRECTO requerido por server.js
        });

        if (res.ok) {
          alert('Cambios guardados con éxito.');
        } else {
          const err = await res.json().catch(()=>({}));
          alert('Error al guardar: ' + (err.error || res.status));
        }
      } catch (e) {
        console.error('Error guardando:', e);
        alert('Error de red al guardar');
      }
    }

    document.getElementById('btn-guardar').addEventListener('click', guardarCambios);

    // Logout
    document.getElementById('btn-logout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST', credentials: 'include' });
      location.reload();
    });
  </script>
</body>
</html>
